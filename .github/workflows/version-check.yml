---
name: version-check

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches:
      - main

permissions:
  contents: read # Required to check out the module sources.

# Superseded pushes to the same branch are wasted work; cancel them.
concurrency:
  group: version-check-${{ github.event.pull_request.head.repo.full_name || github.repository }}/${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  version-check:
    name: version check
    if: github.event.repository.name != 'terraform-azurerm-avm-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version
        uses: $/.github/actions/version-check
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
