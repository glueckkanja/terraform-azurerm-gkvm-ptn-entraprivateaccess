version: 2

updates:
  # Stale action pins are what broke CI in this repo before: the upstream AVM
  # template deleted the shared actions and nothing here noticed. Keep the
  # pinned SHAs moving so that never goes unnoticed again.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Hold back freshly published versions for a week so a compromised release
    # is likely to be yanked before Dependabot proposes it here.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
    open-pull-requests-limit: 1

  - package-ecosystem: terraform
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      terraform:
        patterns:
          - "*"
    labels:
      - dependencies
    open-pull-requests-limit: 1
